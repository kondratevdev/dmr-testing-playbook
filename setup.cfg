[flake8]
# Base flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true

# Plugins:
max-complexity = 6
max-line-length = 80
max-imports = 25
max-arguments = 6

allowed-domain-names = data

# We only run wemake-python-styleguide and system checks:
select = WPS, E99

ignore =
  # Allow logic in `__init__`
  WPS412

# Excluding generated and virtual-environment files:
extend-exclude =
  .venv
  .mypy_cache

# Ignoring some errors in Django boilerplate and tests:
per-file-ignores =
  playbook/manage.py: WPS202, WPS433
  playbook/server/settings.py: WPS226, WPS407
  playbook/server/urls.py: WPS202, WPS226, WPS407
  playbook/server/wsgi.py: WPS407
  tests/*.py: WPS202, WPS204, WPS211, WPS218, WPS226, WPS430, WPS431, WPS462, WPS476
  playbook/server/apps/**/migrations/*.py: WPS432, WPS102
