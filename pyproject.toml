[project]
name = "dmr-testing-playbook"
version = "0.1.0"
description = "Real-world API testing patterns for django-modern-rest"
readme = "README.md"
keywords = [
  "API",
  "Django",
  "OpenAPI",
  "REST",
  "django-modern-rest",
  "testing",
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "django-modern-rest[attrs,openapi]>=0.15,<0.16",
  "punq>=0.8,<1",
]

[dependency-groups]
dev = [
  "covdefaults>=2.3,<3",
  "django-coverage-plugin>=3.1",
  "django-stubs[compatible-mypy]>=6.1,<6.2",
  "mypy>=2.3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pytest-django>=4.12,<4.15",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.16,<0.17",
  "schemathesis>=4.21,<5",
  "tracecov>=0.23",
  "wemake-python-styleguide[mcp]>=1.8,<2",
]

[[project.authors]]
name = "Alexander Kondratev"
email = "mail@kondratev.dev"

[project.urls]
GitHub = "https://github.com/kondratevdev/dmr-testing-playbook"
django-modern-rest = "https://github.com/wemake-services/django-modern-rest"
awesome-django-modern-rest = "https://github.com/kondratevdev/awesome-django-modern-rest"

[tool.uv]
# This repository is a runnable example project, not a distributable package.
package = false


[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
target-version = "py313"
line-length = 80
preview = true
fix = true
output-prefer-rule-codes = true

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
# Django settings are declarative configuration.
"playbook/server/settings.py" = [ "D100", "D101", "RUF012", "S105" ]
# Django-generated migrations contain mutable class attributes by design.
"playbook/server/apps/*/migrations/*.py" = [ "D101", "E501", "RUF012"]
# Django model metadata is declarative and uses class-level values.
"playbook/server/apps/*/models.py" = [ "RUF012" ]
# Standard Django entry points need imports and execution at module scope.
"playbook/manage.py" = [ "PLC0415", "S104", "T201" ]
"playbook/server/wsgi.py" = [ "E402" ]
# Lazy imports keep the dependency bootstrap independent from applications.
"playbook/server/implemented.py" = [ "PLC0415", "SLF001" ]
# Tests intentionally use assertions and have a more compact style.
"tests/**/*.py" = [ "D", "S101" ]

[tool.ruff.lint]
select = [
  "A",     # flake8-builtins
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "C90",   # mccabe
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "DJ",    # flake8-django
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle
  "ERA",   # flake8-eradicate
  "EXE",   # flake8-executable
  "F",     # pyflakes
  "FBT",   # flake8-boolean-trap
  "FLY",   # pyflint
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "INT",   # flake8-gettext
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # perflint
  "PIE",   # flake8-pie
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # ruff
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self
  "SLOT",  # flake8-slots
  "T100",  # flake8-debugger
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle
  "YTT",   # flake8-2020
]
ignore = [
  "A005",     # allow to shadow stdlib and builtin module names
  "ASYNC119", # `contextlib.aclosing` is not detected
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "D418",
  "D421",
  "ISC001",   # implicit string concat conflicts with `ruff format`
  "ISC003",   # prefer explicit string concat over implicit concat
  "PLC0414",  # do not raise on `as` re-exports
  "PLR09",    # WPS handles complexity separately
  "PLR2004",  # do not report magic numbers
  "PLR6301",  # do not require class/static methods when self is not used
  "PLW2901",  # allow to redefine iteration targets in for loops
  "RUF029",   # async API may intentionally omit `await`
  "RUF067",   # WPS handles `__init__.py` logic better
  "RUF105",   # keep old `# noqa` comments style
  "RUF106",   # prefer old error codes
  "RUF201",   # prefer error codes over verbose names
  "TRY003",   # permit descriptive exception messages
]
external = [ "WPS" ]
# Plugin configs:
flake8-gettext.extend-function-names = [ "_" ]
flake8-quotes.inline-quotes = "single"
isort.known-first-party = [ "server" ]
mccabe.max-complexity = 6
pydocstyle.convention = "google"


[tool.mypy]
# Mypy configuration:
# https://mypy.readthedocs.io/en/latest/config_file.html
mypy_path = ["playbook"]
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
extra_checks = true
strict_equality_for_none = true
strict = true
plugins = [
  "mypy_django_plugin.main",
  "pydantic.mypy",
]


[tool.django-stubs]
# Docs: https://github.com/typeddjango/django-stubs
django_settings_module = "server.settings"


[tool.pytest.ini_options]
# pytest configuration:
# https://docs.pytest.org/en/stable/customize.html

# pytest-django configuration:
# https://pytest-django.readthedocs.io/en/latest/
DJANGO_SETTINGS_MODULE = "server.settings"

# Timeout for tests, so they can not take longer
# than this amount of seconds.
# You should adjust this value to be as low as possible.
# Configuration:
# https://pypi.org/project/pytest-timeout/
timeout = 5

# Strict `@xfail` by default:
xfail_strict = true

# Directories that are not visited by pytest collector:
norecursedirs = [
  "*.egg",
  ".eggs",
  "dist",
  "build",
  "docs",
  ".tox",
  ".git",
  "__pycache__",
  ".hypothesis",
]

# You will need to measure your tests speed with `-n auto` and without it,
# so you can see whether it gives you any performance gain, or just gives
# you an overhead. See `docs/template/development-process.rst`.
addopts = [
  "--strict-markers",
  "--strict-config",
  "--doctest-modules",
  "--fail-on-template-vars",
  # Output:
  "--tb=short",
  # Coverage:
  "--cov=server",
  "--cov=tests",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-fail-under=100",
  # Tracecov:
  "--tracecov-format=text,html,markdown",
  "--tracecov-fail-under-operations=100",
  "--tracecov-fail-under-examples=100",
  "--tracecov-fail-under-parameters=100",
  "--tracecov-fail-under-keywords=100",
  # Framework-level responses like 406 and 422 are documented in OpenAPI,
  # but they are not always reachable through regular Schemathesis input generation.
  "--tracecov-fail-under-responses=100",
]

# Fail on warnings:
filterwarnings = ["error"]


[tool.coverage.run]
# Coverage configuration:
# https://coverage.readthedocs.io/en/latest/config.html
plugins = [
  # Docs: https://github.com/nedbat/django_coverage_plugin
  "django_coverage_plugin",
  # Docs: https://pypi.org/project/covdefaults
  "covdefaults",
]
